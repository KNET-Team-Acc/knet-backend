name: Migraciones en producción

# Aplica db/migrations/*.sql pendientes (y refresca el catálogo con el seed) en Neon cuando
# llega a main un cambio de base de datos. Vercel despliega la API en paralelo: las migraciones
# deben ser aditivas (columnas/tablas nuevas) para que el código anterior siga funcionando.
on:
  push:
    branches: [main]
    paths:
      - "db/**"
      - "src/lib/agenda.js"        # lo importa db/seed.js
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:
    inputs:
      seed:
        description: "Correr también db:seed (solo hace upserts del catálogo y los usuarios demo)"
        type: boolean
        default: true

# Nunca dos migraciones a la vez; tampoco se cancela una que ya empezó
concurrency:
  group: db-migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: db:migrate en Neon
    runs-on: ubuntu-latest
    env:
      # Conexión directa (sin pooler) de Neon: secreto NEON_DATABASE_URL_UNPOOLED del repo
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
      # production bloquea `db/migrate.js --reset`. config.js exige un JWT_SECRET con
      # NODE_ENV=production, aunque migrar no firma nada: este valor no se usa.
      NODE_ENV: production
      JWT_SECRET: not-used-by-migrations
    steps:
      - name: Comprobar el secreto
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secreto NEON_DATABASE_URL_UNPOOLED (DATABASE_URL_UNPOOLED de Vercel)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run db:migrate
      - if: github.event_name == 'push' || inputs.seed
        run: npm run db:seed
